version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: erp_postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: erp_user
      POSTGRES_PASSWORD: erp_password
      POSTGRES_DB: enterprise_erp
    volumes:
      - pg_erp_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp_user -d enterprise_erp"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - erp_internal_network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: erp_app_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=enterprise_erp
      - DB_USER=erp_user
      - DB_PASS=erp_password
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - ./database:/app/database
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 20s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - erp_internal_network

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: erp_n8n
    restart: unless-stopped
    environment:
      - N8N_HOST=${DOMAIN_NAME:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://${DOMAIN_NAME:-localhost}:5678/
    ports:
      - "5678:5678"
    volumes:
      - n8n_erp_data:/home/node/.n8n
      - ./n8n/workflows:/backup/workflows
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - erp_internal_network

  nginx:
    image: nginx:alpine
    container_name: erp_nginx_proxy
    restart: unless-stopped
    depends_on:
      - backend
      - n8n
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/erp.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_etc:/etc/letsencrypt:ro
      - certbot_var:/var/lib/letsencrypt:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - erp_internal_network

volumes:
  pg_erp_data:
  n8n_erp_data:
  certbot_etc:
  certbot_var:

networks:
  erp_internal_network:
    driver: bridge
