# =========================================================================
# Nginx Reverse Proxy Configuration - Hệ Thống ERP Yến Sào & Cà Phê
# =========================================================================

# Tối ưu nén Gzip cho các tài sản Frontend tĩnh (JS, CSS, SVG, JSON)
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

# Giới hạn kích thước tải lên (hỗ trợ upload file Excel báo cáo thuế & kiểm toán)
client_max_body_size 50M;

# Upstream Backend FastAPI
upstream erp_backend {
    server backend:8000;
    keepalive 32;
}

# Upstream n8n Automation Engine
upstream n8n_engine {
    server n8n:5678;
    keepalive 16;
}

server {
    listen 80;
    server_name localhost _;

    # Header bảo mật cơ bản
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # 1. Định tuyến Webhook n8n (phục vụ tự động hóa & AI Tool Calling)
    location /webhook/ {
        proxy_pass http://n8n_engine/webhook/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # 2. Định tuyến Toàn bộ Hệ Thống ERP, Storefront & Backend API
    location / {
        proxy_pass http://erp_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Cache tĩnh cho assets build
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        proxy_pass http://erp_backend;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # Health check endpoint
    location /health {
        proxy_pass http://erp_backend/api/health;
        access_log off;
    }
}
