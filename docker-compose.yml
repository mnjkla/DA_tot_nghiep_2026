version: '3.8'

services:
  postgres_erp:
    image: postgres:15-alpine
    container_name: erp_postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: erp_user
      POSTGRES_PASSWORD: erp_password
      POSTGRES_DB: enterprise_erp
    ports:
      - "5432:5432"
    volumes:
      - pg_erp_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql

volumes:
  pg_erp_data: