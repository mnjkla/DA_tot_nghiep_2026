version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: erp_postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: erp_user
      POSTGRES_PASSWORD: erp_password
      POSTGRES_DB: enterprise_erp
    ports:
      - "5432:5432"
    volumes:
      - pg_erp_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: erp_n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
    volumes:
      - n8n_erp_data:/home/node/.n8n
      - ./n8n/workflows:/backup/workflows

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: erp_cloudflare_tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://host.docker.internal:8000

volumes:
  pg_erp_data:
  n8n_erp_data:

